<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | ACE3i Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #67bed9;
            --secondary-color: #ee7725;
            --bg-dark: #515151;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            overflow: hidden;
            position: relative;
        }

        /* Motifs d'arrière-plan stylisés */
        .bg-pattern {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(103, 190, 217, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(238, 119, 37, 0.05) 0%, transparent 40%);
            z-index: -1;
        }

        .bg-icons i {
            position: absolute;
            color: rgba(103, 190, 217, 0.08);
            z-index: -1;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .login-card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15); 
            width: 100%; 
            max-width: 420px; 
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }

        .logo-container { text-align: center; margin-bottom: 30px; }
        .logo-img { 
            max-width: 90px; 
            margin-bottom: 15px; 
            border-radius: 15px; 
            padding: 8px;
            background: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border: 2px solid rgba(103, 190, 217, 0.2);
        }
        
        .app-name { font-size: 28px; font-weight: 800; color: var(--bg-dark); margin-bottom: 5px; letter-spacing: -0.5px; }
        .app-name span { color: var(--primary-color); }
        .app-subtitle { color: #64748b; font-size: 14px; margin-bottom: 25px; font-weight: 500; }
        
        .form-label { font-size: 0.85rem; color: #475569; margin-bottom: 8px; }
        .input-group-text { background-color: #f1f5f9; border: 1px solid #e2e8f0; border-right: none; color: #94a3b8; border-radius: 12px 0 0 12px; }
        .form-control { border: 1px solid #e2e8f0; border-left: none; padding: 12px; font-size: 15px; background-color: #f1f5f9; border-radius: 0 12px 12px 0; }
        .form-control:focus { background-color: #fff; border-color: var(--primary-color); box-shadow: none; }
        .input-group:focus-within .input-group-text { background-color: #fff; border-color: var(--primary-color); color: var(--primary-color); }
        
        .btn-primary { 
            background-color: var(--primary-color); 
            border: none; 
            padding: 14px; 
            font-weight: 700; 
            border-radius: 12px; 
            transition: all 0.3s ease; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        .btn-primary:hover { background-color: #56acc7; transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(103, 190, 217, 0.5); }
        
        .password-toggle { cursor: pointer; border-left: none; background: #f1f5f9; border-radius: 0 12px 12px 0; border-color: #e2e8f0; color: #94a3b8; }
        #passwordInput { border-radius: 0; }
        .input-group:focus-within .password-toggle { background-color: #fff; border-color: var(--primary-color); }
        
        .alert { border-radius: 12px; font-size: 14px; border: none; font-weight: 500; }
        .alert-danger { background-color: #fef2f2; color: #dc2626; border: 1px solid #fee2e2; }
        .alert-success { background-color: #f0fdf4; color: #16a34a; border: 1px solid #dcfce7; }
    </style>
</head>
<body>
    <!-- Motifs d'arrière-plan -->
    <div class="bg-pattern"></div>
    <div class="bg-icons" id="bgIcons">
        <!-- Généré par JS pour varier les positions -->
    </div>

    <div class="login-card">
        <div class="logo-container">
            <img th:src="@{/images/ac.png}" alt="ACE3i Logo" class="logo-img">
            <div class="app-name">ACE3i <span>Connect</span></div>
            <div class="app-subtitle">Gestion Intelligente des Missions</div>
        </div>

        <!-- Alertes -->
        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center mb-4">
            <i class="fas fa-exclamation-circle me-2"></i> Identifiants incorrects
        </div>
        <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center mb-4">
            <i class="fas fa-check-circle me-2"></i> Session fermée avec succès
        </div>

        <form th:action="@{/login}" method="post" id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-semibold">Identifiant</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user-shield"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Nom d'utilisateur" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Mot de passe</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-key"></i></span>
                    <input type="password" name="password" id="passwordInput" class="form-control" placeholder="••••••••" required>
                    <span class="input-group-text password-toggle" onclick="togglePassword()">
                        <i class="fas fa-eye" id="toggleIcon"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3" id="submitBtn">
                Accéder au portail
            </button>
        </form>
        
        <div class="text-center mt-4">
            <p class="text-muted mb-0" style="font-size: 0.75rem;">
                &copy; 2026 ACE3i Africa. Tous droits réservés.
            </p>
        </div>
    </div>

    <script>
        // Génération des icônes flottantes en arrière-plan
        const icons = ['fa-network-wired', 'fa-server', 'fa-tasks', 'fa-file-signature', 'fa-shield-alt', 'fa-project-diagram'];
        const container = document.getElementById('bgIcons');
        
        for(let i = 0; i < 15; i++) {
            const icon = document.createElement('i');
            const iconName = icons[Math.floor(Math.random() * icons.length)];
            icon.className = `fas ${iconName}`;
            icon.style.left = Math.random() * 100 + 'vw';
            icon.style.top = (Math.random() * 100 + 100) + 'vh';
            icon.style.fontSize = (Math.random() * 20 + 20) + 'px';
            icon.style.animationDuration = (Math.random() * 10 + 10) + 's';
            icon.style.animationDelay = (Math.random() * 5) + 's';
            container.appendChild(icon);
        }

        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('toggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');

        if(loginForm) {
            loginForm.addEventListener('submit', function() {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authentification...';
            });
        }
    </script>
</body>
</html>
