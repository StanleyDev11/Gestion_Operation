<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Journal d\'Audit')}"></head>
<body>
    <div th:replace="~{layout :: sidebar('logs')}"></div>
    <div th:replace="~{layout :: header('Journal d\'Audit')}"></div>

    <main class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Journal d'Audit</h3>
                <p class="text-muted small mb-0">Historique complet des actions effectuées sur le système.</p>
            </div>
            <button type="button" class="btn btn-outline-danger shadow-sm px-4" onclick="openPurgeModal()">
                <i class="fas fa-trash-alt me-2"></i> Purger les logs
            </button>
        </div>

        <!-- Formulaire de purge caché -->
        <form th:action="@{/admin/logs/purge}" method="post" id="purgeForm" style="display:none;">
            <input type="hidden" name="startDate" id="purgeStartDate">
            <input type="hidden" name="endDate" id="purgeEndDate">
            <input type="hidden" name="confirmPassword" id="purgeConfirmPassword">
        </form>

        <!-- Filtres -->
        <div class="card card-custom border-0 shadow-sm mb-4">
            <div class="card-body">
                <form th:action="@{/admin/logs}" method="get" class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label small fw-bold text-muted">Utilisateur</label>
                        <input type="text" name="username" th:value="${username}" class="form-control" placeholder="Rechercher par nom...">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold text-muted">Action</label>
                        <input type="text" name="action" th:value="${action}" class="form-control" placeholder="Type d'action...">
                    </div>
                    <div class="col-md-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-filter me-2"></i> Filtrer
                        </button>
                        <a th:href="@{/admin/logs}" class="btn btn-light border w-100">
                            Effacer
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Table des Logs -->
        <div class="card card-custom border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="ps-4">Date & Heure</th>
                                <th>Utilisateur</th>
                                <th>Action</th>
                                <th>Détails</th>
                                <th>Adresse IP</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="log : ${logs}">
                                <td class="ps-4" th:text="${#temporals.format(log.timestamp, 'dd/MM/yyyy HH:mm:ss')}"></td>
                                <td th:text="${log.username}"></td>
                                <td>
                                    <span class="badge bg-secondary fw-normal" th:text="${log.action}"></span>
                                </td>
                                <td th:text="${log.details}"></td>
                                <td th:text="${log.ipAddress}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(logs)}">
                                <td colspan="5" class="text-center py-5 text-muted">
                                    <i class="fas fa-info-circle me-2"></i> Aucun log trouvé
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- Pagination -->
            <div class="card-footer bg-white border-0 py-3" th:if="${totalPages > 0}">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="text-muted small">
                        Affichage de <span th:text="${logs.size()}">0</span> sur <span th:text="${totalItems}">0</span> entrées
                    </div>
                    <nav aria-label="Page navigation">
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-item-link page-link" th:href="@{/admin/logs(page=${currentPage - 1}, username=${username}, action=${action})}">
                                    <i class="fas fa-chevron-left"></i>
                                </a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
                                th:classappend="${currentPage == i} ? 'active'">
                                <a class="page-link" th:href="@{/admin/logs(page=${i}, username=${username}, action=${action})}" th:text="${i + 1}"></a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                <a class="page-item-link page-link" th:href="@{/admin/logs(page=${currentPage + 1}, username=${username}, action=${action})}">
                                    <i class="fas fa-chevron-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{layout :: scripts}"></div>
    <script th:inline="javascript">
        async function openPurgeModal() {
            const { value: formValues } = await Swal.fire({
                title: 'Purger les journaux d\'audit',
                html:
                    '<div class="text-start mb-3">' +
                    '  <label class="form-label small fw-bold">Date de début</label>' +
                    '  <input id="swal-start" class="form-control" type="date">' +
                    '</div>' +
                    '<div class="text-start mb-3">' +
                    '  <label class="form-label small fw-bold">Date de fin</label>' +
                    '  <input id="swal-end" class="form-control" type="date">' +
                    '</div>' +
                    '<div class="text-start">' +
                    '  <label class="form-label small fw-bold text-danger">Confirmer avec votre mot de passe</label>' +
                    '  <input id="swal-password" class="form-control" type="password" placeholder="Mot de passe admin...">' +
                    '</div>',
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Lancer la purge',
                cancelButtonText: 'Annuler',
                confirmButtonColor: '#d33',
                preConfirm: () => {
                    const start = document.getElementById('swal-start').value;
                    const end = document.getElementById('swal-end').value;
                    const password = document.getElementById('swal-password').value;
                    
                    if (!start || !end || !password) {
                        Swal.showValidationMessage('Veuillez remplir tous les champs');
                        return false;
                    }
                    if (new Date(end) < new Date(start)) {
                        Swal.showValidationMessage('La date de fin doit être après la date de début');
                        return false;
                    }
                    return { start, end, password };
                }
            });

            if (formValues) {
                document.getElementById('purgeStartDate').value = formValues.start;
                document.getElementById('purgeEndDate').value = formValues.end;
                document.getElementById('purgeConfirmPassword').value = formValues.password;
                
                showGlobalLoader();
                document.getElementById('purgeForm').submit();
            }
        }
    </script>
</body>
</html>
