# Application Name
spring.application.name=ACE3i Connect

# MySQL Database Configuration
# Remplacez 'localhost:3306/db_missions' par votre configuration réelle
spring.datasource.url=jdbc:mysql://localhost:3306/db_missions?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=8087

# Date Formatting for Thymeleaf
spring.mvc.format.date-time=iso

# File Upload Size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Actuator Endpoints Configuration (Secured for Production)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=false
management.metrics.export.prometheus.enabled=false
