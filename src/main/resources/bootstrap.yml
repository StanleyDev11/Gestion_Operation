spring:
  application:
    name: connector-otr
  cloud:
    vault:
      token: ${VAULT_TOKEN}
      uri: ${VAULT_ADDR}
      kv:
        enabled: false
      enabled: false
      fail-fast: false  # true = le service ne démarre pas tant que Vault n’est pas joignable (plus sûr pour éviter la connexion au YAML de secours).
