<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impression des fonctionnalités client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print {
            .no-print { display: none !important; }
            body { margin: 0; }
            .card { border: 1px solid #ccc !important; box-shadow: none !important; }
        }
    </style>
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-3 no-print">
                <div>
                    <h5 class="mb-1">Impression des fonctionnalités client</h5>
                    <p class="text-muted mb-0">Choisis une version puis imprime la liste.</p>
                </div>
                <div class="d-flex gap-2">
                    <a class="btn btn-outline-secondary btn-sm" th:href="@{/feature-tracking/dashboard}">Retour dashboard</a>
                    <button type="button" class="btn btn-primary btn-sm" onclick="window.print()">Imprimer</button>
                </div>
            </div>

            <form method="get" th:action="@{/feature-tracking/dashboard/print}" class="row g-3 align-items-end mb-4 no-print">
                <input type="hidden" name="clientId" th:value="${client.id}">
                <div class="col-md-7">
                    <label class="form-label">Client</label>
                    <input type="text" class="form-control" th:value="${client.name}" readonly>
                </div>
                <div class="col-md-5">
                    <label for="deploymentId" class="form-label">Version à imprimer</label>
                    <select id="deploymentId" name="deploymentId" class="form-select" onchange="this.form.submit()">
                        <option th:each="deployment : ${deployments}"
                                th:value="${deployment.id}"
                                th:selected="${deployment.id == selectedDeployment.id}"
                                th:text="${deployment.applicationVersion.versionNumber} + ' - ' + ${deployment.deploymentDate}">
                            v1.0.0 - 2026-01-01
                        </option>
                    </select>
                </div>
            </form>

            <div class="mb-3">
                <h4 class="mb-1" th:text="${client.name}">Client</h4>
                <div class="text-muted">
                    Version:
                    <strong th:text="${selectedDeployment.applicationVersion.versionNumber}">v1.0.0</strong>
                    -
                    Déployée le
                    <strong th:text="${selectedDeployment.deploymentDate}">2026-01-01</strong>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(selectedFeatures)}" class="alert alert-light border mb-0">
                Aucune fonctionnalité sur cette version.
            </div>

            <div th:unless="${#lists.isEmpty(selectedFeatures)}" class="table-responsive">
                <table class="table table-bordered align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 70px;">#</th>
                        <th>Fonctionnalité</th>
                        <th style="width: 180px;">Type</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="featureLink, stat : ${selectedFeatures}">
                        <td th:text="${stat.count}">1</td>
                        <td th:text="${featureLink.feature.name}">Nom fonctionnalité</td>
                        <td>
                            <span th:if="${featureLink.clientSpecific}" class="badge bg-warning text-dark">Spécifique client</span>
                            <span th:unless="${featureLink.clientSpecific}" class="badge bg-primary">Globale</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
