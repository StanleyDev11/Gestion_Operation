<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Erreur')}"></head>
<body>
    <div th:replace="~{layout :: sidebar('')}"></div>
    <div th:replace="~{layout :: header('Erreur')}"></div>

    <main class="main-content">
        <div class="container text-center py-5">
            <div class="card card-custom border-0 shadow-sm p-5">
                <i class="fas fa-exclamation-triangle text-danger mb-4" style="font-size: 4rem;"></i>
                <h2 class="fw-bold text-dark">Oups ! Quelque chose s'est mal passé.</h2>
                <p class="text-muted mb-4" th:text="${error}">Détail de l'erreur...</p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="/" class="btn btn-primary px-4 rounded-pill">Retour à l'accueil</a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 rounded-pill">Page précédente</a>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
