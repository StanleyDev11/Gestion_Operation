<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Gestion Utilisateur')}"></head>
<body>

    <div th:replace="~{layout :: sidebar('settings')}"></div>
    <div th:replace="~{layout :: header('Créer un Nouveau Personnel')}"></div>

    <main class="main-content">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-custom">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold text-primary"><i class="fas fa-user-plus me-2"></i>DÉTAILS DU COMPTE</h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/admin/users/save}" th:object="${user}" method="post">
                            <input type="hidden" th:field="*{id}" />
                            
                            <div class="row g-3 mb-4">
                                <div class="col-md-12">
                                    <label class="form-label fw-semibold">Nom Complet</label>
                                    <div class="input-group shadow-sm">
                                        <span class="input-group-text bg-white" th:classappend="${#fields.hasErrors('fullName')} ? 'border-danger text-danger' : ''"><i class="fas fa-id-card text-muted"></i></span>
                                        <input type="text" th:field="*{fullName}" class="form-control border-start-0" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''" placeholder="Ex: Jean Dupont" />
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Erreur</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Identifiant de connexion</label>
                                    <div class="input-group shadow-sm">
                                        <span class="input-group-text bg-white" th:classappend="${#fields.hasErrors('username')} ? 'border-danger text-danger' : ''"><i class="fas fa-user text-muted"></i></span>
                                        <input type="text" th:field="*{username}" class="form-control border-start-0" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''" placeholder="j.dupont" />
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Erreur</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Rôle / Accès</label>
                                    <div class="input-group shadow-sm">
                                        <span class="input-group-text bg-white" th:classappend="${#fields.hasErrors('role')} ? 'border-danger text-danger' : ''"><i class="fas fa-user-shield text-muted"></i></span>
                                        <select th:field="*{role}" class="form-select border-start-0" th:classappend="${#fields.hasErrors('role')} ? 'is-invalid' : ''">
                                            <option value="ROLE_TECHNICIAN">Technicien (Accès limité)</option>
                                            <option value="ROLE_ADMIN">Administrateur (Accès complet)</option>
                                        </select>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">Erreur</div>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label fw-semibold">Mot de passe</label>
                                    <div class="input-group shadow-sm">
                                        <span class="input-group-text bg-white" th:classappend="${#fields.hasErrors('password')} ? 'border-danger text-danger' : ''"><i class="fas fa-lock text-muted"></i></span>
                                        <input type="password" th:field="*{password}" class="form-control border-start-0" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" placeholder="••••••••" />
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Erreur</div>
                                    </div>
                                    <div th:if="${user.id != null}" class="form-text text-muted small">Laissez vide pour conserver le mot de passe actuel.</div>
                                </div>
                            </div>

                            <div class="mt-5 pt-3 border-top d-flex justify-content-end gap-3">
                                <a th:href="@{/admin/users}" class="btn btn-outline-secondary px-4">Annuler</a>
                                <button type="submit" class="btn btn-primary px-5 shadow-sm">
                                    <i class="fas fa-save me-2"></i>Enregistrer le Compte
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
