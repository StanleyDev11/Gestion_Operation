spring:
  application:
    name: ACE3i Connect
  datasource:
    url: jdbc:mysql://localhost:3306/db_missions?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  mvc:
    format:
      date-time: iso
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  cloud:
    vault:
      token: ${VAULT_TOKEN}
      uri: ${VAULT_ADDR}
      kv:
        enabled: false
      enabled: false
      fail-fast: false

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: false
